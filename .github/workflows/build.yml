name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew :app:assembleRelease

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk minimal-tv.apk

      # Publica sempre no mesmo endereço: .../releases/download/latest/minimal-tv.apk
      - name: Publicar release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest minimal-tv.apk \
            --target "$GITHUB_SHA" \
            --title "Minimal TV (build ${{ github.run_number }})" \
            --notes "Commit ${GITHUB_SHA::7}"
