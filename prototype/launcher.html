<title>Protótipo Launcher TV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: palco 1920x1080 (a TV) escalado pra caber; controles do protótipo embaixo.
   Medidas do palco = design/v3 (botões 76, placas 206x286, cards 256, focado 542, gap 30). */
:root{
  --page:#F5F5F7; --page-card:#FFFFFF; --page-fg:#1D1D1F; --page-mute:#6E6E73; --page-line:#D2D2D7; --page-accent:#007AFF;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#000000; --page-card:#1C1C1E; --page-fg:#F5F5F7; --page-mute:#98989D; --page-line:#38383A; --page-accent:#0A84FF; color-scheme:dark } }
:root[data-theme="dark"]{ --page:#000000; --page-card:#1C1C1E; --page-fg:#F5F5F7; --page-mute:#98989D; --page-line:#38383A; --page-accent:#0A84FF; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--page);color:var(--page-fg);font-family:var(--font);
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--page-mute);margin:2px 0 0;line-height:1.45}

/* ---------- controles do protótipo ---------- */
.ctrls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-start}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp>span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--page-mute)}
.seg{display:inline-flex;background:var(--page-card);border:1px solid var(--page-line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;font-weight:500;color:var(--page-fg);background:transparent;border:0;border-radius:9px;padding:8px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--page-accent);color:#fff}
.seg button:focus-visible,.pad button:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:6px}
.pad button{font:inherit;font-size:16px;color:var(--page-fg);background:var(--page-card);border:1px solid var(--page-line);border-radius:12px;cursor:pointer;display:grid;place-items:center}
.pad button:active{background:var(--page-accent);color:#fff}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .o{grid-column:2;grid-row:2;font-size:13px;font-weight:600}
.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}.pad .b{grid-column:1;grid-row:3;font-size:12px}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:430px}
.sw button[data-c]{width:30px;height:30px;border-radius:50%;border:2px solid var(--page-line);background:var(--c);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--page-accent);outline-offset:2px}
.swp{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--page-fg);background:var(--page-card);border:1px solid var(--page-line);border-radius:12px;padding:5px 10px;cursor:pointer}
.swp input{width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer}
.swr{font:inherit;font-size:13px;font-weight:500;color:var(--page-fg);background:var(--page-card);border:1px solid var(--page-line);border-radius:12px;padding:8px 12px;cursor:pointer}
.swr:focus-visible,.sw button:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.copybox{width:100%;min-height:150px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--page-fg);background:var(--page-card);border:1px solid var(--page-line);border-radius:12px;padding:12px;resize:vertical}
.hint{font-size:12px;color:var(--page-mute);line-height:1.5;max-width:46ch}

/* ---------- palco ---------- */
.vp{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--page-line);container-type:size}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  font-family:var(--font);color:var(--text);background:var(--bg);user-select:none;
  --ease:cubic-bezier(.2,.8,.2,1);--smooth:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.28,.64,1);--sp:.55s;   /* a mola real é calculada em JS (linear()) */
  --bg:#F5F5F7;--card:#FFFFFF;--on-card:#1D1D1F;--text:#1D1D1F;--support:#86868B;--accent:#007AFF;--slit:#F5F5F7;
  --a:#6C4CF1;--a2:#2c1a8c}
.stage[data-theme="dark"]{--bg:#000000;--card:#2C2C2E;--on-card:#F5F5F7;--text:#F5F5F7;--support:#98989D;--accent:#0A84FF;--slit:#000000}
.stage *{box-sizing:border-box}

.bg{position:absolute;inset:0;transition:background-color .6s var(--ease);background:var(--bg);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(170px);opacity:0;transition:background-color .7s var(--ease),opacity .4s}
.b1{width:1000px;height:1000px;left:1000px;top:-330px;background:var(--a)}
.b2{width:900px;height:900px;left:-260px;top:420px;background:var(--a2)}
.b3{width:700px;height:700px;left:620px;top:560px;background:var(--accent)}

.screen{position:absolute;inset:0;transition:opacity .45s var(--smooth),transform var(--sp) var(--spring),filter .45s var(--smooth)}
.stage[data-view="home"] .grid-screen{opacity:0;pointer-events:none;transform:scale(1.06);filter:blur(14px)}
.stage[data-view="grid"] .home-screen{opacity:0;pointer-events:none;transform:scale(.94);filter:blur(14px)}
.stage[data-motion="simple"] .screen{filter:none!important}

/* botões do sistema: bloco 2x3 na Home, coluna na Grade */
.sys{position:absolute;left:1328px;top:170px;display:grid;grid-template-columns:repeat(2,76px);grid-auto-rows:76px;column-gap:28px;row-gap:29px}
.side{position:absolute;left:108px;top:240px;display:flex;flex-direction:column;gap:29px}
.circ{width:76px;height:76px;border-radius:24px;border:0;padding:0;display:grid;place-items:center;cursor:pointer;
  background:var(--card);color:var(--on-card);transition:transform var(--sp) var(--spring),background-color .25s,color .25s,box-shadow .3s}
.circ svg{width:36px;height:36px;display:block}
.circ.on{background:var(--accent);color:#fff;transform:scale(1.16)}
.circ.pressed{transform:scale(.88);transition-duration:.09s}

/* relógio de placas */
.clock{position:absolute;left:414px;top:170px;display:flex}
.tile{position:relative;width:206px;height:286px;border-radius:30px;background:var(--card);color:var(--on-card);margin-left:14px;
  display:grid;place-items:center;font-size:250px;font-weight:500;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;
  transform:perspective(900px) rotateX(0deg);transition:transform var(--sp) var(--spring)}
.tile.out{transform:perspective(900px) rotateX(-90deg);transition:transform .15s cubic-bezier(.5,0,1,.6)}
.tile.in{transform:perspective(900px) rotateX(90deg);transition:none}
.tile:nth-child(3){margin-left:30px}.tile:first-child{margin-left:0}
.tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--slit)}
.date{position:absolute;left:0;right:0;top:106px;text-align:center;font-size:28px;line-height:34px;color:var(--support);font-weight:400}

/* faixa da home */
.strip{position:absolute;left:108px;top:676px;width:1704px;height:380px;overflow:hidden}
.strip .card{top:40px}
.label{position:absolute;font-size:40px;line-height:40px;font-weight:500;letter-spacing:-.015em;white-space:nowrap;
  transition:left var(--sp) var(--spring),top var(--sp) var(--spring),opacity .2s}
@keyframes swapIn{from{opacity:0;transform:translateY(12px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.label.swap{animation:swapIn .42s var(--smooth)}
.hlabel{top:641px}

/* cards */
.card{position:absolute;height:256px;width:256px;border-radius:48px;overflow:hidden;cursor:pointer;color:#fff;background:var(--c1);
  display:grid;place-items:center;
  transition:left var(--sp) var(--spring),width var(--sp) var(--spring),top var(--sp) var(--spring),transform var(--sp) var(--spring),
    box-shadow .45s var(--smooth),background-color .26s,border-color .26s}
.card.on{transform:translateY(-10px)}
@keyframes arrive{from{transform:perspective(900px) translateY(-3px) rotateY(var(--tilt,0deg)) scale(.97)}
  to{transform:perspective(900px) translateY(-10px) rotateY(0deg) scale(1)}}
.card.arrive{animation:arrive var(--sp) var(--spring)}
.stage[data-motion="simple"] .card.arrive{animation:none}
.card .glyph{font-size:100px;font-weight:600;letter-spacing:-.03em;transition:opacity .18s;line-height:1}
.card .glyph svg{width:108px;height:108px;display:block}
.card .banner{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:30px 38px;opacity:0;transition:opacity .22s;
  background:linear-gradient(135deg,var(--c1),var(--c2))}
.card .wm{font-size:58px;font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap;
  transform:translateY(18px);opacity:0;transition:transform var(--sp) var(--spring),opacity .3s}
.card.on .wm{transform:none;opacity:1}
.card .art{position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.14);
  transform:translate(30px,-22px) scale(.88);transition:transform calc(var(--sp)*1.5) var(--spring)}
.card.on .art{transform:none}
.card.on .banner{opacity:1}.card.on .glyph{opacity:0}
.card .dot{position:absolute;right:22px;top:22px;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff}
.card.util{background:var(--card);color:var(--on-card)}
.card.util .banner{background:var(--card);align-items:center;justify-content:flex-start;gap:26px}
.card.util .banner svg{width:96px;height:96px;flex:none;color:var(--on-card);opacity:.7}
.card.util .wm{font-size:46px;font-weight:600;color:var(--on-card)}
.card.util .glyph{color:var(--on-card);opacity:.7}

/* logos de marca nos cards (monocromático = tinta única; colorido = cor da marca) */
.card .glyph.logo{display:grid;place-items:center;width:100%;height:100%;color:var(--ink,#fff);font-size:0}
.card .glyph.logo .lm,.card .glyph.logo .lc{display:grid;place-items:center}
.card .glyph.logo .lc{display:none}
.card .glyph.logo svg{width:var(--lw,178px);height:auto;max-height:116px;display:block}
.card .glyph.logo[data-k="youtube"]{--lw:136px}
.card .glyph.logo[data-k="globoplay"]{--lw:150px}
.card .glyph.logo[data-k="downloader"]{--lw:112px}
.card .glyph.logo[data-k="megafute"]{--lw:104px}
.card .glyph.logo[data-k="cdntv"]{--lw:198px}
.card .glyph.logo[data-k="prime"]{--lw:150px}
.card .glyph.logo .pm{display:block;width:124px;height:124px;background:currentColor;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center}
.card .glyph.logo img{width:124px;height:124px;display:block}
.mk{display:block;background:currentColor;aspect-ratio:var(--r,3);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center}
.card .glyph.logo .mk{width:var(--lw,184px)}
.card .glyph.logo .mkw{position:relative;display:block;width:var(--lw,184px);aspect-ratio:var(--r,3)}
.mkw .mk{position:absolute;inset:0;width:100%}
.card .wml .mk{height:56px;width:auto}
.card .wml{display:flex;align-items:center;gap:18px}
.card .wml .bl{display:flex;align-items:center}
.card .wml svg{height:60px;width:auto;display:block}
.card .wml[data-k="prime"] svg{height:80px}.card .wml[data-k="megafute"] svg{height:54px}.card .wml[data-k="youtube"] svg{height:64px}
.card .wml .pm{width:76px;height:76px;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center}
.card .wmt{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
.stage[data-look="clean"][data-cards="mono"] .card:not(.util) .glyph.logo{color:var(--on-card)}
.stage[data-look="frost"] .card:not(.util) .glyph.logo{color:var(--text)}
.stage[data-logo="color"][data-look="clean"][data-cards="mono"] .glyph.logo .lm,.stage[data-logo="color"][data-look="frost"] .glyph.logo .lm{display:none}
.stage[data-logo="color"][data-look="clean"][data-cards="mono"] .glyph.logo .lc,.stage[data-logo="color"][data-look="frost"] .glyph.logo .lc{display:grid}

/* ---- visual 1: Limpo ---- */
.stage[data-look="clean"] .card{box-shadow:0 12px 32px rgba(0,0,0,.14)}
.stage[data-look="clean"] .card.on{box-shadow:0 30px 70px rgba(0,0,0,.30)}
.stage[data-look="clean"][data-theme="dark"] .card{box-shadow:0 12px 32px rgba(0,0,0,.6)}
.stage[data-look="clean"] .circ{box-shadow:0 6px 18px rgba(0,0,0,.08)}

/* tema do Limpo: claro = fundo branco + cards pretos; escuro = fundo preto + cards brancos */
.stage[data-look="clean"][data-cards="mono"]{--bg:#FFFFFF;--card:#0B0B0D;--on-card:#FFFFFF;--text:#0B0B0D;--support:#6E6E73;--slit:#FFFFFF}
.stage[data-look="clean"][data-cards="mono"][data-theme="dark"]{--bg:#000000;--card:#FFFFFF;--on-card:#0B0B0D;--text:#F5F5F7;--support:#98989D;--slit:#000000}
.stage[data-look="clean"][data-cards="mono"] .card:not(.util){background:var(--card)}
.stage[data-look="clean"][data-cards="mono"] .card:not(.util) .glyph{color:var(--c1)}
.stage[data-look="clean"][data-cards="mono"] .card{box-shadow:0 14px 34px rgba(0,0,0,.26)}
.stage[data-look="clean"][data-cards="mono"] .card.on{box-shadow:0 34px 76px rgba(0,0,0,.40)}
.stage[data-look="clean"][data-cards="mono"] .circ{box-shadow:0 8px 22px rgba(0,0,0,.22)}
.stage[data-look="clean"][data-cards="mono"][data-theme="dark"] .card{box-shadow:0 14px 40px rgba(255,255,255,.07)}
.stage[data-look="clean"][data-cards="mono"][data-theme="dark"] .card.on{box-shadow:0 30px 80px rgba(255,255,255,.16)}
.stage[data-look="clean"][data-cards="mono"][data-theme="dark"] .circ{box-shadow:0 8px 22px rgba(255,255,255,.06)}
.stage[data-look="clean"][data-cards="mono"] .circ.on{background:var(--accent);color:#fff}

/* ---- visuais 2 e 3: Vidro (só botões, placas e menus) e Vidro total (tudo de vidro). Fundo: LEDs desfocados ---- */
.stage[data-look="glass"]{--text:#10213d;--support:#34476b;--card:rgba(255,255,255,.2);--slit:rgba(255,255,255,.55);
  --gl1:rgba(255,255,255,.46);--gl2:rgba(255,255,255,.12);--gl3:rgba(255,255,255,.26);--rim:rgba(255,255,255,.95);--edge:rgba(255,255,255,.55);background:#E7EAF4}
.stage[data-look="glass"][data-theme="dark"]{--text:#F5F5F7;--support:#C4C9E6;--card:rgba(255,255,255,.1);--slit:rgba(255,255,255,.3);
  --gl1:rgba(255,255,255,.20);--gl2:rgba(255,255,255,.04);--gl3:rgba(255,255,255,.12);--rim:rgba(255,255,255,.55);--edge:rgba(255,255,255,.26);background:#04050B}
.stage[data-look="glass"] .bg{background:#E7EAF4}
.stage[data-look="glass"][data-theme="dark"] .bg{background:#04050B}
.stage[data-look="glass"] .blob{opacity:.22}
.stage[data-look="glass"][data-theme="dark"] .blob{opacity:.3}
.leds{position:absolute;inset:0;display:none;pointer-events:none}
.stage[data-look="glass"] .leds{display:block}
.led{position:absolute;border-radius:50%;background:var(--lc);filter:blur(var(--bl,16px));opacity:var(--o,.8);
  animation:drift var(--dur,12s) ease-in-out infinite alternate,twinkle var(--tw,5s) ease-in-out infinite alternate;transition:background-color .7s var(--smooth)}
.stage[data-look="glass"] .led{opacity:calc(var(--o,.8)*.75)}
.stage[data-look="glass"][data-theme="dark"] .led{mix-blend-mode:screen;opacity:var(--o,.8)}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx,12px),var(--dy,-18px))}}
@keyframes twinkle{from{filter:blur(var(--bl,16px)) brightness(.75)}to{filter:blur(var(--bl,16px)) brightness(1.25)}}
.stage[data-look="glass"] .date{color:var(--text);text-shadow:0 1px 10px rgba(255,255,255,.35)}
.stage[data-look="glass"][data-theme="dark"] .date{text-shadow:0 1px 12px rgba(0,0,0,.5)}
/* vidro: translúcido + desfoque + brilho na borda de cima */
.stage[data-look="glass"] .circ,.stage[data-look="glass"] .tile,.stage[data-look="glass"] .card.util{
  background:linear-gradient(145deg,var(--gl1),var(--gl2) 55%,var(--gl3));
  -webkit-backdrop-filter:blur(16px) saturate(1.9) brightness(1.06);backdrop-filter:blur(16px) saturate(1.9) brightness(1.06);
  border:1px solid var(--edge);color:var(--text);
  box-shadow:inset 0 2px 1px var(--rim),inset 0 -2px 3px rgba(255,255,255,.2),inset 0 0 26px rgba(255,255,255,.16),0 18px 42px rgba(10,20,60,.22)}
.stage[data-look="glass"] .tile::after{background:var(--slit);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.stage[data-look="glass"] .card.util .banner{background:transparent}
.stage[data-look="glass"] .card.util .wm,.stage[data-look="glass"] .card.util .glyph,.stage[data-look="glass"] .card.util .banner svg{color:var(--text)}
.stage[data-look="glass"] .circ.on{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 78%,white),var(--accent));border-color:rgba(255,255,255,.5);color:#fff;
  box-shadow:inset 0 2px 1px rgba(255,255,255,.75),0 12px 34px color-mix(in srgb,var(--accent) 55%,transparent)}
.stage[data-look="glass"] .toast{background:linear-gradient(145deg,var(--gl1),var(--gl2));-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8);
  color:var(--text);border:1px solid var(--edge);box-shadow:inset 0 2px 1px var(--rim)}
/* Vidro: cards de app sólidos, com brilho no alto */
.stage[data-look="glass"] .card:not(.util){box-shadow:inset 0 2px 1px rgba(255,255,255,.5),0 20px 46px rgba(0,0,0,.28)}
.stage[data-look="glass"] .card:not(.util)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 46%)}
.stage[data-look="glass"] .card.on{box-shadow:inset 0 2px 1px rgba(255,255,255,.55),0 30px 70px rgba(0,0,0,.36)}
/* ---- visual 4: Vidro fosco (a primeira versão: película translúcida e fosca, manchas de cor do app no fundo) ---- */
.stage[data-look="frost"]{--card:rgba(255,255,255,.62);--text:#1D1D1F;--support:#55555B;--slit:rgba(120,120,140,.35);background:#E9ECF4}
.stage[data-look="frost"][data-theme="dark"]{--card:rgba(255,255,255,.10);--text:#F5F5F7;--support:#B4B4BA;--slit:rgba(0,0,0,.55);background:#06070B}
.stage[data-look="frost"] .bg{background:#E9ECF4}
.stage[data-look="frost"][data-theme="dark"] .bg{background:#06070B}
.stage[data-look="frost"] .blob{opacity:.55}
.stage[data-look="frost"][data-theme="dark"] .blob{opacity:.5}
.stage[data-look="frost"] .card:not(.util){background:rgba(255,255,255,.14);color:#fff;-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1.5px solid rgba(255,255,255,.32)}
.stage[data-look="frost"] .card:not(.util) .glyph{color:var(--c1);filter:saturate(1.2)}
.stage[data-look="frost"][data-theme="dark"] .card:not(.util) .glyph{color:#fff}
.stage[data-look="frost"] .card:not(.util) .banner{background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 88%,transparent),color-mix(in srgb,var(--c2) 78%,transparent))}
.stage[data-look="frost"] .card.util,.stage[data-look="frost"] .circ,.stage[data-look="frost"] .tile{color:var(--text);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1.5px solid rgba(255,255,255,.55)}
.stage[data-look="frost"][data-theme="dark"] .card.util,.stage[data-look="frost"][data-theme="dark"] .circ,.stage[data-look="frost"][data-theme="dark"] .tile{border-color:rgba(255,255,255,.2)}
.stage[data-look="frost"] .circ.on{background:var(--accent);border-color:transparent;color:#fff}
.stage[data-look="frost"] .card.util .banner{background:transparent}
.stage[data-look="frost"] .card.util .wm,.stage[data-look="frost"] .card.util .glyph,.stage[data-look="frost"] .card.util .banner svg{color:var(--text)}
.stage[data-look="frost"] .card.on{box-shadow:0 30px 80px rgba(0,0,0,.28)}

/* ---- fundo livre: qualquer cor; textos acompanham o brilho da cor (data-tone) ---- */
.stage[data-bg="custom"]{background:var(--cbg)!important;--bg:var(--cbg)!important}
.stage[data-bg="custom"] .bg{background:var(--cbg)!important}
.stage[data-bg="custom"][data-tone="light"]{--text:#0B0B0D!important;--support:rgba(0,0,0,.58)!important}
.stage[data-bg="custom"][data-tone="dark"]{--text:#F5F5F7!important;--support:rgba(255,255,255,.72)!important}
.stage[data-bg="custom"][data-look="clean"]{--slit:var(--cbg)!important}

/* ---- visual 3: Ousado ---- */
.stage[data-look="bold"]{--text:#fff;--support:rgba(255,255,255,.72);--card:rgba(255,255,255,.18);--slit:rgba(0,0,0,.28);
  background:color-mix(in oklab,var(--a) 100%,black 14%)}
.stage[data-look="bold"][data-theme="dark"]{background:color-mix(in oklab,var(--a) 100%,black 52%)}
.stage[data-look="bold"] .bg{background:color-mix(in oklab,var(--a) 100%,black 14%)}
.stage[data-look="bold"][data-theme="dark"] .bg{background:color-mix(in oklab,var(--a) 100%,black 52%)}
.stage[data-look="bold"] .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 700px at 78% 8%,rgba(255,255,255,.22),transparent 70%)}
.stage[data-look="bold"] .card{border-radius:72px}
.stage[data-look="bold"] .card:not(.on){background:rgba(255,255,255,.16)}
.stage[data-look="bold"] .card .glyph{color:#fff}
.stage[data-look="bold"] .card.on{background:#fff;box-shadow:0 34px 80px rgba(0,0,0,.35)}
.stage[data-look="bold"] .card:not(.util) .banner{background:#fff;align-items:flex-end}
.stage[data-look="bold"] .card:not(.util) .wm{color:var(--c1);font-size:68px}
.stage[data-look="bold"] .card:not(.util) .art{background:var(--c1);opacity:.14}
.stage[data-look="bold"] .card.util .banner{background:#fff}
.stage[data-look="bold"] .card.util .banner svg{color:var(--a)}
.stage[data-look="bold"] .card.util .wm{color:#1D1D1F}
.stage[data-look="bold"] .circ{background:rgba(255,255,255,.18);color:#fff}
.stage[data-look="bold"] .circ.on{background:#fff;color:var(--a)}
.stage[data-look="bold"] .tile{background:rgba(255,255,255,.18);color:#fff;border-radius:34px}
.stage[data-look="bold"] .label{font-weight:700;font-size:44px}

/* grade */
.gwrap{position:absolute;left:0;top:0;width:1920px;height:3000px;transition:transform .6s var(--smooth)}
.glabel{top:0}

.toast{position:absolute;left:50%;bottom:40px;transform:translate(-50%,26px) scale(.9);opacity:0;padding:16px 30px;border-radius:999px;
  font-size:26px;font-weight:500;background:rgba(20,20,22,.82);color:#fff;transition:opacity .2s,transform var(--sp) var(--spring);pointer-events:none;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

@media (prefers-reduced-motion: reduce){ .stage *{transition-duration:.01s!important;animation:none!important} }

  /* ---------- mola estilo Apple: curva calculada de uma mola amortecida ---------- */
  var SPRING = (function(){
    var k = 260, c = 22, m = 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), wd = w0 * Math.sqrt(1 - z * z);

      line:'<g '+L+'><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/></g><path fill="currentColor" d="M12 6.8a5.2 5.2 0 0 0 0 10.4z"/>',
      solid:'<circle cx="12" cy="12" r="9" fill="currentColor" opacity=".45"/><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18z"/>'
    },
    boost:{
      line:'<g '+L+'><path d="M13 3 5.5 13.5H11l-1 7.5 8.5-10.5H13z"/></g>',
      solid:'<path fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" d="M13 3 5.5 13.5H11l-1 7.5 8.5-10.5H13z"/>'
    },
    hdmi:{
      line:'<g '+L+'><path d="M4 8h16v5l-3 3.6H7L4 13z"/><path d="M8 11.4h8"/></g>',
      solid:'<path fill="currentColor" fill-rule="evenodd" d="M4 8h16v5l-3 3.6H7L4 13zm4 2.6v1.6h8v-1.6z"/>'
    },
    settings:{
      line:'<g '+L+'><path d="M4 7h3.2M14.6 7H20M4 12h9.4M19 12h1M4 17h2M12.2 17H20"/><circle cx="11" cy="7" r="2.4"/><circle cx="16.4" cy="12" r="2.4"/><circle cx="9" cy="17" r="2.4"/></g>',
      solid:'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16" opacity=".4"/></g><circle cx="11" cy="7" r="3" fill="currentColor"/><circle cx="16.4" cy="12" r="3" fill="currentColor"/><circle cx="9" cy="17" r="3" fill="currentColor"/>'
    },
    bluetooth:{
      line:'<g '+L+'><path d="M7 8l10 8-5 5V3l5 5-10 8"/></g>',
      solid:'<g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l10 8-5 5V3l5 5-10 8"/></g>'
    },
    plus:{
      line:'<g '+L+'><path d="M12 5v14M5 12h14"/></g>',
      solid:'<g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g>'
    }
  };
  var CIRCLES = [
    {k:'apps',     n:'Home / Todos os apps'},
    {k:'theme',    n:'Tema'},
    {k:'boost',    n:'Acelerador'},
    {k:'hdmi',     n:'HDMI'},
    {k:'bluetooth',n:'Bluetooth'},
    {k:'settings', n:'Configurações'}
  ];
  function svg(k, style){ return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[k][style] + '</svg>'; }

  /* ---------- estado ---------- */
  var S = { look:'clean', theme:'light', icons:'solid', view:'home', cards:'mono', motion:'spring', logo:'mono', bg:null, dir:0,
            zone:'strip', i:0,      // home: 'strip' | 'circles'
            gi:0, ci:4, si:0, scroll:0, gscroll:0, offMin:0, pos:[] };

  /* ---------- relógio de placas ---------- */
  var clock = $('#clock'), tiles = [], shown = ['','','',''];
  for (var t = 0; t < 4; t++){ var d = document.createElement('div'); d.className = 'tile'; clock.appendChild(d); tiles.push(d); }
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function tick(first){
    var now = new Date(Date.now() + S.offMin * 60000);
    var digits = (pad2(now.getHours()) + pad2(now.getMinutes())).split('');
    digits.forEach(function(ch, i){
      if (shown[i] === ch) return;
      var was = shown[i]; shown[i] = ch;
      if (first || !was){ tiles[i].textContent = ch; return; }
      var tl = tiles[i];
      tl.classList.add('out');                         // a placa vira pra frente (cai)
      setTimeout(function(){
        tl.textContent = ch;
        tl.classList.remove('out'); tl.classList.add('in'); void tl.offsetWidth;   // volta por baixo
        tl.classList.remove('in');                     // e assenta com a mola
      }, 150);
    });
    var wd = cap(now.toLocaleDateString('pt-BR', {weekday:'long'}));
    var mo = cap(now.toLocaleDateString('pt-BR', {month:'long'}));
    $('#date').textContent = wd + ', ' + now.getDate() + ' de ' + mo + ' de ' + now.getFullYear() + ' em Colméia-TO, 29°C';
  }
  tick(true); setInterval(function(){ tick(false); }, 5000);

  /* ---------- círculos ---------- */
  var circEls = { H:[], G:[] };
  function buildCircles(host, key){
    host.innerHTML = '';
    CIRCLES.forEach(function(c, idx){
      var b = document.createElement('button');
      b.className = 'circ'; b.setAttribute('aria-label', c.n); b.innerHTML = svg(c.k, S.icons);
      b.addEventListener('click', function(){ tapCircle(idx); });
      host.appendChild(b); circEls[key][idx] = b;
    });
  }
  function refreshIcons(){
    ['H','G'].forEach(function(k){ circEls[k].forEach(function(b, idx){ b.innerHTML = svg(CIRCLES[idx].k, S.icons); }); });
    stripEls.forEach(function(el, k){ if (items[k].type === 'plus' || items[k].type === 'grid') fillUtil(el, items[k]); });
  }

  /* ---------- cards ---------- */
  function logoParts(k){
    var L = LOGOS[k]; if (!L) return null;
    if (L.mask){
      var r = L.ratio;
      var mk = function(m, extra){ return '<span class="mk" style="--r:' + r + ';-webkit-mask-image:url(' + m + ');mask-image:url(' + m + ');' + (extra || '') + '"></span>'; };
      return { mono:mk(L.mask),
               color:L.maskB ? '<span class="mkw" style="--r:' + r + '">' + mk(L.maskA) + mk(L.maskB, 'background:' + L.accent) + '</span>' : mk(L.mask) };
    }
    if (L.png){ var m = 'url(' + L.png + ')';
      return { mono:'<span class="pm" style="-webkit-mask-image:' + m + ';mask-image:' + m + '"></span>', color:'<img alt="" src="' + L.png + '">' }; }
    return { mono:L.mono, color:L.color, bmono:L.bmono || L.mono, bcolor:L.bcolor || L.color };
  }
  function glyphHTML(a){
    var lg = logoParts(a.logo);
    if (!lg) return '<div class="glyph">' + a.g + '</div>';
    return '<div class="glyph logo" data-k="' + a.logo + '"><span class="lm">' + lg.mono + '</span><span class="lc">' + lg.color + '</span></div>';
  }
  function bannerHTML(a){
    var lg = logoParts(a.logo), L = LOGOS[a.logo];
    if (!lg) return '<span class="wm">' + a.n + '</span>';
    var inner = L.bannerColor ? lg.bcolor : lg.bmono;
    return '<span class="wm wml" data-k="' + a.logo + '"><span class="bl">' + inner + '</span>' + (L.wordmark ? '' : '<span class="wmt">' + a.n + '</span>') + '</span>';
  }
  function appCard(a, idx, dot){
    var el = document.createElement('div');
    el.className = 'card'; el.style.setProperty('--c1', a.c1); el.style.setProperty('--c2', a.c2);
    if (a.ink) el.style.setProperty('--ink', a.ink);
    el.innerHTML = glyphHTML(a) + '<div class="banner">' + bannerHTML(a) + '<i class="art"></i></div>' + (dot ? '<i class="dot"></i>' : '');
    return el;
  }
  function fillUtil(el, it){
    var k = it.type === 'plus' ? 'plus' : 'apps';
    el.innerHTML = '<div class="glyph">' + svg(k, S.icons) + '</div><div class="banner">' + svg(k, S.icons) + '<span class="wm">' + it.n + '</span></div>';
  }

  var items = [], stripEls = [], strip = $('#strip');
  APPS.slice(0, FAVS).forEach(function(a){ items.push({type:'app', app:a, n:a.n}); });
  items.push({type:'plus', n:'Adicionar'});
  items.push({type:'grid', n:'Todos os apps'});
  items.forEach(function(it, k){
    var el;
    if (it.type === 'app') el = appCard(it.app, k, false);
    else { el = document.createElement('div'); el.className = 'card util'; fillUtil(el, it); }
    el.addEventListener('click', function(){ tapStrip(k); });
    strip.appendChild(el); stripEls.push(el);
  });

  var gwrap = $('#gwrap'), gridEls = [];
  APPS.forEach(function(a, k){
    var el = appCard(a, k, k < FAVS);
    el.addEventListener('click', function(){ tapGrid(k); });
    gwrap.appendChild(el); gridEls.push(el);
  });

  buildCircles($('#circH'), 'H'); buildCircles($('#circG'), 'G');

  /* ---------- layout (mesmas contas do app Android) ---------- */
  var W_ON = 542, W = 256, GAP = 30;
  function layoutStrip(){
    var x = 0, pos = [];
    items.forEach(function(it, k){ var w = (S.zone === 'strip' && k === S.i) ? W_ON : W; pos.push([x, w]); x += w + GAP; });
    S.pos = pos;
    var f = pos[S.i], sc = S.scroll;
    if (f[0] + f[1] > sc + 1704) sc = f[0] + f[1] - 1704 + GAP;
    if (f[0] < sc) sc = Math.max(0, f[0] - GAP);
    S.scroll = sc;
    stripEls.forEach(function(el, k){
      el.style.left = (pos[k][0] - sc) + 'px'; el.style.width = pos[k][1] + 'px';
      el.classList.toggle('on', S.zone === 'strip' && k === S.i);
    });
    var lb = $('#hlabel');
    lb.textContent = items[S.i].n;
    lb.style.left = (108 + f[0] - sc) + 'px';
    lb.style.opacity = S.zone === 'strip' ? 1 : 0;
  }
  var COLS = 4, RIGHT = 1812, ROW0 = 186, PITCH = 366;
  function layoutGrid(){
    var rows = Math.ceil(APPS.length / COLS);
    for (var r = 0; r < rows; r++){
      var idx = []; for (var k = r * COLS; k < Math.min(APPS.length, r * COLS + COLS); k++) idx.push(k);
      var ws = idx.map(function(k){ return (S.view === 'grid' && S.zone === 'grid' && k === S.gi) ? W_ON : W; });
      var total = ws.reduce(function(a, b){ return a + b; }, 0) + GAP * (idx.length - 1);
      var x = RIGHT - total;                       // fileiras alinhadas à direita (design/v3)
      idx.forEach(function(k, j){
        var el = gridEls[k];
        el.style.left = x + 'px'; el.style.width = ws[j] + 'px'; el.style.top = (ROW0 + r * PITCH) + 'px';
        el.classList.toggle('on', S.zone === 'grid' && k === S.gi);
        x += ws[j] + GAP;
      });
    }
    var fr = Math.floor(S.gi / COLS), top = ROW0 + fr * PITCH, sy = S.gscroll;
    if (S.zone === 'grid'){
      if (top - sy < ROW0) sy = Math.max(0, top - ROW0);
      if (top + 256 - sy > 990) sy = top + 256 - 990;
    }
    S.gscroll = sy; gwrap.style.transform = 'translateY(' + (-sy) + 'px)';
    var gl = $('#glabel'), cx = parseFloat(gridEls[S.gi].style.left) || 0;
    gl.textContent = APPS[S.gi].n; gl.style.left = cx + 'px'; gl.style.top = (top - 76) + 'px';
    gl.style.opacity = S.zone === 'grid' ? 1 : 0;
  }
  function paint(){
    stage.dataset.look = S.look; stage.dataset.theme = S.theme; stage.dataset.view = S.view;
    stage.dataset.cards = S.cards; stage.dataset.motion = S.motion; stage.dataset.logo = S.logo; applyMotion();
    stage.dataset.bg = S.bg ? 'custom' : 'theme';
    if (S.bg){ stage.style.setProperty('--cbg', S.bg); stage.dataset.tone = lum(S.bg) > 0.5 ? 'light' : 'dark'; } else stage.dataset.tone = '';
    document.querySelectorAll('#sw button[data-c]').forEach(function(b){ b.setAttribute('aria-pressed', (S.bg && b.dataset.c.toLowerCase() === S.bg.toLowerCase()) ? 'true' : 'false'); });
    var cur = null;
    if (S.view === 'home' && S.zone === 'strip' && items[S.i].type === 'app') cur = items[S.i].app;
    if (S.view === 'grid' && S.zone === 'grid') cur = APPS[S.gi];
    if (cur){ stage.style.setProperty('--a', cur.c1); stage.style.setProperty('--a2', cur.c2); }
    circEls.H.forEach(function(b, idx){ b.classList.toggle('on', S.view === 'home' && S.zone === 'circles' && idx === S.ci); });
    circEls.G.forEach(function(b, idx){ b.classList.toggle('on', S.view === 'grid' && S.zone === 'side' && idx === S.si); });
    layoutStrip(); layoutGrid();
    seg('#sLook', S.look); seg('#sTheme', S.theme); seg('#sIcons', S.icons); seg('#sView', S.view); seg('#sCards', S.cards); seg('#sMotion', S.motion); seg('#sLogo', S.logo);
    arrive();
  }
  function lum(hex){
    var n = parseInt(hex.replace('#', ''), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    function f(c){ c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
  }
  var lastFocusKey = '';
  function arrive(){
    var idx = S.view === 'home' ? (S.zone === 'strip' ? S.i : 'c' + S.ci) : (S.zone === 'grid' ? S.gi : 's' + S.si);
    var key = S.view + ':' + S.zone + ':' + idx;
    if (key === lastFocusKey) return; lastFocusKey = key;
    var el = null, lb = null;
    if (S.view === 'home' && S.zone === 'strip'){ el = stripEls[S.i]; lb = $('#hlabel'); }
    if (S.view === 'grid' && S.zone === 'grid'){ el = gridEls[S.gi]; lb = $('#glabel'); }
    if (el && S.motion === 'spring'){
      el.style.setProperty('--tilt', (S.dir * -8) + 'deg');
      el.classList.remove('arrive'); void el.offsetWidth; el.classList.add('arrive');
    }
    if (lb){ lb.classList.remove('swap'); void lb.offsetWidth; lb.classList.add('swap'); }
  }
  function seg(sel, v){ document.querySelectorAll(sel + ' button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false'); }); }

  /* ---------- ações ---------- */
  var toastT;
  function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 1500); }
  function setView(v){
    S.view = v;
    if (v === 'grid'){ S.zone = 'grid'; S.gi = Math.min(S.gi, APPS.length - 1); S.gscroll = 0; }
    else { S.zone = 'strip'; }
    paint();
  }
  function setTheme(t){ S.theme = t; paint(); }
  function circleAction(idx){
    var k = CIRCLES[idx].k;
    if (k === 'apps') setView(S.view === 'home' ? 'grid' : 'home');
    else if (k === 'theme') setTheme(S.theme === 'light' ? 'dark' : 'light');
    else if (k === 'boost') toast('Memória liberada: 118 MB');
    else if (k === 'hdmi') toast('HDMI 1 · HDMI 2 · AV');
    else if (k === 'bluetooth') toast('Abre o Bluetooth da TV');
    else toast('Abre as Configurações da TV');
  }
  function tapCircle(idx){
    if (S.view === 'home'){ S.zone = 'circles'; S.ci = idx; } else { S.zone = 'side'; S.si = idx; }
    paint();
    var b = circEls[S.view === 'home' ? 'H' : 'G'][idx];
    b.classList.add('pressed'); setTimeout(function(){ b.classList.remove('pressed'); }, 140);
    circleAction(idx);
  }
  function activateStrip(){
    var it = items[S.i];
    if (it.type === 'app') toast('Abrir ' + it.n);
    else if (it.type === 'plus') toast('Abre a barra lateral de apps');
    else setView('grid');
  }
  function tapStrip(k){ if (S.zone === 'strip' && S.i === k) activateStrip(); else { S.zone = 'strip'; S.i = k; paint(); } }
  function tapGrid(k){ if (S.zone === 'grid' && S.gi === k) toast('Abrir ' + APPS[k].n); else { S.zone = 'grid'; S.gi = k; paint(); } }

  /* ---------- navegação (setas / OK / Voltar) ---------- */
  function key(k){
    S.dir = k === 'right' ? 1 : k === 'left' ? -1 : 0;
    if (S.view === 'home'){
      if (S.zone === 'strip'){
        if (k === 'left') S.i = Math.max(0, S.i - 1);
        else if (k === 'right') S.i = Math.min(items.length - 1, S.i + 1);
        else if (k === 'up'){                      // sobe pro bloco 2x3, na coluna mais perto do card
          var p = S.pos[S.i], cx = 108 + p[0] - S.scroll + p[1] / 2;
          S.zone = 'circles'; S.ci = 4 + (cx > 1418 ? 1 : 0);
        }
        else if (k === 'ok') return activateStrip();
      } else {
        var c = S.ci % 2, r = Math.floor(S.ci / 2);
        if (k === 'left' && c > 0) S.ci--;
        else if (k === 'right' && c < 1) S.ci++;
        else if (k === 'up' && r > 0) S.ci -= 2;
        else if (k === 'down'){ if (r < 2) S.ci += 2; else S.zone = 'strip'; }
        else if (k === 'ok') return circleAction(S.ci);
      }
    } else {
      if (k === 'back') return setView('home');
      if (S.zone === 'grid'){
        var gc = S.gi % COLS, gr = Math.floor(S.gi / COLS), lastRow = Math.floor((APPS.length - 1) / COLS);
        if (k === 'left'){
          if (gc > 0) S.gi--;
          else {                                    // vai pra coluna lateral, no botão mais perto da altura do card
            var cy = ROW0 + gr * PITCH + 128 - S.gscroll, best = 0, bd = 1e9;
            for (var q = 0; q < 6; q++){ var d = Math.abs(240 + q * 105.2 + 38 - cy); if (d < bd){ bd = d; best = q; } }
            S.zone = 'side'; S.si = best;
          }
        }
        else if (k === 'right' && S.gi < APPS.length - 1 && gc < COLS - 1) S.gi++;
        else if (k === 'down' && S.gi + COLS < APPS.length) S.gi += COLS;
        else if (k === 'down' && gr < lastRow) S.gi = APPS.length - 1;
        else if (k === 'up' && gr > 0) S.gi -= COLS;
        else if (k === 'ok') return toast('Abrir ' + APPS[S.gi].n);
      } else {
        if (k === 'up') S.si = Math.max(0, S.si - 1);
        else if (k === 'down') S.si = Math.min(5, S.si + 1);
        else if (k === 'right'){                   // volta pra grade, na fileira mais perto do botão
          var by = 240 + S.si * 105.2 + 38, row = Math.round((by - 128 - ROW0 + S.gscroll) / PITCH);
          row = Math.max(0, Math.min(Math.floor((APPS.length - 1) / COLS), row));
          S.zone = 'grid'; S.gi = Math.min(APPS.length - 1, row * COLS);
        }
        else if (k === 'ok') return circleAction(S.si);
      }
    }
    paint();
  }
  var MAP = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', Enter:'ok', Escape:'back', Backspace:'back'};
  window.addEventListener('keydown', function(e){
    var k = MAP[e.key]; if (!k) return;
    if (e.target && /^(input|textarea|select)$/i.test(e.target.tagName)) return;
    if (e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter')) return;   // deixa os botões do protótipo funcionarem
    e.preventDefault(); key(k);
  });
  document.querySelectorAll('#pad button').forEach(function(b){ b.addEventListener('click', function(){ key(b.dataset.k); }); });

  /* ---------- controles do protótipo ---------- */
  function bind(sel, fn){ document.querySelectorAll(sel + ' button').forEach(function(b){ b.addEventListener('click', function(){ fn(b.dataset.v); }); }); }
  bind('#sLook', function(v){ S.look = v; paint(); });
  bind('#sTheme', function(v){ setTheme(v); });
  bind('#sIcons', function(v){ S.icons = v; refreshIcons(); paint(); });
  bind('#sView', function(v){ setView(v); });
  bind('#sCards', function(v){ S.cards = v; paint(); });
  bind('#sMotion', function(v){ S.motion = v; paint(); });
  bind('#sLogo', function(v){ S.logo = v; paint(); });
  document.querySelectorAll('#sw button[data-c]').forEach(function(b){ b.addEventListener('click', function(){ S.bg = b.dataset.c; paint(); }); });
  $('#bgColor').addEventListener('input', function(e){ S.bg = e.target.value; paint(); });
  $('#bgReset').addEventListener('click', function(){ S.bg = null; paint(); });
  $('#bFlip').addEventListener('click', function(){ S.offMin += 1; tick(false); });

  /* ---------- copiar a configuração escolhida (pra colar no chat) ---------- */
  var NAMES = {
    look:{clean:'Limpo', glass:'Vidro (só botões e placas, fundo de LEDs)', frost:'Vidro fosco (película translúcida, 1ª versão)', bold:'Ousado'},
    theme:{light:'Claro', dark:'Escuro'}, icons:{line:'Traço', solid:'Cheio'},
    cards:{mono:'Preto e branco (claro: cards pretos; escuro: cards brancos)', color:'Cor do app'},
    motion:{spring:'Apple (mola)', simple:'Simples'}, view:{home:'Home', grid:'Grade'}
  };
  function configText(){
    var cs = getComputedStyle(stage), toks = ['--bg','--card','--on-card','--text','--support','--accent','--slit'];
    if (S.look === 'glass' || S.look === 'frost') toks = toks.concat(['--gl1','--gl2','--gl3','--rim','--edge']);
    var lines = [
      'PROTÓTIPO LAUNCHER TV · configuração escolhida',
      'Visual: ' + NAMES.look[S.look],
      'Tema: ' + NAMES.theme[S.theme],
      'Ícones: ' + NAMES.icons[S.icons],
      'Cards: ' + (S.look === 'clean' ? NAMES.cards[S.cards] : 'n/a neste visual'),
      'Logos: ' + (S.logo === 'mono' ? 'monocromático' : 'coloridos (valem no Limpo com cards pretos/brancos e no Vidro fosco)'),
      'Animação: ' + NAMES.motion[S.motion],
      'Tela em exibição: ' + NAMES.view[S.view],
      'Fundo: ' + (S.bg ? 'cor livre ' + S.bg : (S.look === 'glass' ? 'LEDs desfocados' : S.look === 'frost' ? 'manchas de cor do app' : 'padrão do tema')),
      'Layout: design/v3 · código: prototype/launcher.html',
      '',
      '--- cores do palco agora ---'
    ];
    toks.forEach(function(t){ lines.push(t + ': ' + cs.getPropertyValue(t).trim()); });
    lines.push('', '(cole isto no chat do Claude pra aplicar no app)');
    return lines.join('\n');
  }
  var copyTimer;
  function copyMsg(t){ var m = $('#copyMsg'); m.textContent = t; clearTimeout(copyTimer); copyTimer = setTimeout(function(){ m.textContent = ''; }, 4000); }
  $('#bCopy').addEventListener('click', function(){
    var txt = configText(), box = $('#copyBox');
    function fallback(){ box.hidden = false; box.value = txt; box.focus(); box.select(); copyMsg('Não deu pra copiar sozinho: o texto está selecionado abaixo, copie e cole no chat.'); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ box.hidden = true; copyMsg('Copiado. Cole no chat.'); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  });

  paint();
})();
</script>
